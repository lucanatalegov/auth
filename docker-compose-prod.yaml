        depends_on:
            - oldotpapi
            - auth-api
            - robot4meV1api1            
        deploy:
            replicas: 1
            placement:
                max_replicas_per_node: 1
                #constraints:
                #    - node.hostname ==mit4me01
            resources:
                limits:
                    cpus: '1'
                    memory: 1G
            restart_policy:
                condition: on-failure
        networks:
           production:


upstream apiotp {
    server otpapi:5001 max_fails=5 fail_timeout=5s;
    #server www.google.it backup;
}

upstream  authapi {
    server  auth-api:3000 max_fails=5 fail_timeout=5s;
    #server www.google.it backup;
}
#
upstream apirobot4meV1 {
    server robot4meV1api:5001 max_fails=5 fail_timeout=5s;
    #server www.google.it backup;
}
#
#upstream password {
#        #server password:80 max_fails=5 fail_timeout=5s;
#		server passworddgt:8055 max_fails=5 fail_timeout=5s;
#        #server www.google.it backup;
#}
# HTTPS server
#
#proxy_cache_path /tmp/cache levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;


server {
    listen 80;
#    listen 443 ssl;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;
	
    gzip on;
    gzip_types      text/plain application/xml;
    gzip_min_length 1000;
	

	
	#error_page 502 /502.html;
	#error_page 404 /404.html;


	
    location /mit4me/api/otp/v1/ {
        proxy_pass http://apiotp;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect http:// http://;
    }
	location /mit4me/auth/api {
        proxy_pass http://authapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect http:// http://;
    }
	location /openapi {
        proxy_pass http://authapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect http:// http://;
    }
	location /mit4me/api/robot4me/v1/ {
        proxy_pass http://apirobot4meV1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect http:// http://;
    }
    
}
